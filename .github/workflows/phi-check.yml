name: Patient data check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  phi-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: pytest -q tests/test_phi_check.py
      - run: python scripts/phi_check.py
