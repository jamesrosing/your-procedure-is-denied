<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 450" width="1280" height="450" role="img" aria-label="Medicare Advantage prior authorization, 2023: 3.2 million requests denied; 11.7 percent appealed, about 374,000; 81.7 percent of appeals overturned, about 306,000; about 2.8 million denials never appealed."><rect width="1280" height="450" fill="#f3f5f7"/><text x="64" y="56" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#5f6b78" text-anchor="start">MEDICARE ADVANTAGE PRIOR AUTHORIZATION · 2023</text><text x="64" y="96" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Most denials are never challenged. Most that are challenged fall.</text><text x="64" y="170" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Requests denied</text><rect x="360" y="150" width="800" height="28" fill="#e4e8ec"/><rect x="360" y="150" width="800.0" height="28" fill="#14181e" opacity="0.9"/><text x="374" y="169" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.8" fill="#f3f5f7" text-anchor="start">3.2 million</text><text x="64" y="232" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Appealed</text><rect x="360" y="212" width="800" height="28" fill="#e4e8ec"/><rect x="360" y="212" width="93.6" height="28" fill="#14181e" opacity="0.9"/><text x="467.6" y="231" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.8" fill="#14181e" text-anchor="start">about 374,000 · 11.7% of denials</text><text x="64" y="294" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Overturned on appeal</text><rect x="360" y="274" width="800" height="28" fill="#e4e8ec"/><rect x="360" y="274" width="76.5" height="28" fill="#a3212b" opacity="0.9"/><text x="450.4712" y="293" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="0.8" fill="#14181e" text-anchor="start">about 306,000 · 81.7% of appeals</text><path d="M453.6 352 V362 H1160 V352" fill="none" stroke="#5f6b78" stroke-width="1"/><text x="806.8" y="384" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.6" fill="#5f6b78" text-anchor="middle">ABOUT 2.8 MILLION DENIALS NEVER APPEALED</text><text x="64" y="424" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.6" fill="#5f6b78" text-anchor="start">SOURCE: KFF ANALYSIS OF CMS DATA · COUNTS DERIVED FROM REPORTED RATES</text></svg>
