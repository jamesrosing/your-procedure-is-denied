<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="Flow: a denial arrives as an 835 remittance with reason codes; it is checked against the payer criteria in force on the date of service; a response is drafted from the chart with every statement citing a chart entry; the LITMUS gate checks every statement is warranted; if yes, the physician reviews and signs; if no, the draft is blocked and the physician decides."><rect width="1280" height="400" fill="#f3f5f7"/><text x="48" y="48" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#5f6b78" text-anchor="start">HOW A DENIAL IS ANSWERED</text><rect x="48" y="90" width="210" height="96" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="66" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Denial arrives</text><text x="66" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">835 remittance</text><text x="66" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">CARC + RARC codes</text><line x1="258" y1="138.0" x2="290" y2="138.0" stroke="#5f6b78" stroke-width="1.2"/><path d="M289 133.0 L298 138.0 L289 143.0 Z" fill="#5f6b78"/><rect x="298" y="90" width="230" height="96" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="316" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Payer criteria</text><text x="316" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">policy in force on</text><text x="316" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">the date of service</text><line x1="528" y1="138.0" x2="560" y2="138.0" stroke="#5f6b78" stroke-width="1.2"/><path d="M559 133.0 L568 138.0 L559 143.0 Z" fill="#5f6b78"/><rect x="568" y="90" width="220" height="96" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="586" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Draft from chart</text><text x="586" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">every statement</text><text x="586" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">cites a chart entry</text><line x1="788" y1="138.0" x2="820" y2="138.0" stroke="#5f6b78" stroke-width="1.2"/><path d="M819 133.0 L828 138.0 L819 143.0 Z" fill="#5f6b78"/><path d="M908 76.0 L988 138.0 L908 200.0 L828 138.0 Z" fill="#ffffff" stroke="#14181e" stroke-width="1.5"/><text x="908" y="132.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" letter-spacing="1.6" fill="#14181e" text-anchor="middle">LITMUS</text><text x="908" y="150.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="middle">warranted?</text><line x1="988" y1="138.0" x2="1020" y2="138.0" stroke="#5f6b78" stroke-width="1.2"/><path d="M1019 133.0 L1028 138.0 L1019 143.0 Z" fill="#5f6b78"/><text x="1000" y="128.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#5f6b78" text-anchor="middle">YES</text><rect x="1028" y="90" width="204" height="96" rx="4" fill="#ffffff" stroke="#d3d9e0" stroke-width="1"/><text x="1046" y="124" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#14181e" text-anchor="start" font-style="normal" font-weight="normal">Physician signs</text><text x="1046" y="150" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">reviews every word</text><text x="1046" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">owns the appeal</text><line x1="908" y1="200.0" x2="908" y2="256.0" stroke="#5f6b78" stroke-width="1.2"/><path d="M903 248.0 L908 257.0 L913 248.0 Z" fill="#5f6b78"/><text x="920" y="230.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" letter-spacing="1.6" fill="#5f6b78" text-anchor="start">NO</text><rect x="778" y="258.0" width="260" height="84" rx="4" fill="#ffffff" stroke="#a3212b" stroke-width="1.5"/><text x="796" y="292.0" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#a3212b" text-anchor="start" font-style="normal" font-weight="normal">Blocked</text><text x="796" y="318.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">nothing is sent</text><text x="796" y="336.0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="0.8" fill="#5f6b78" text-anchor="start">the physician decides</text></svg>
