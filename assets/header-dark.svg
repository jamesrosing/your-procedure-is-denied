<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Your procedure is denied. A denial takes an insurer about one second. An appeal takes a physician hours.">
  <rect width="1280" height="440" fill="#0f1318"/>
  <text x="72" y="86" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="2.5" fill="#8e9aa7">PRIOR AUTHORIZATION · CLAIM DENIALS · ACCOUNTABLE AI</text>
  <text x="68" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="78" fill="#e8ecf1">Your procedure is</text>
  <text x="68" y="284" font-family="Georgia, 'Times New Roman', serif" font-size="78" font-style="italic" fill="#ef6a6f">denied.</text>
  <line x1="72" y1="330" x2="1208" y2="330" stroke="#2b333d" stroke-width="1"/>
  <text x="72" y="372" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#8e9aa7">INSURER DECISION</text>
  <rect x="300" y="360" width="4" height="16" fill="#ef6a6f"/>
  <text x="316" y="374" font-family="Georgia, serif" font-size="17" fill="#e8ecf1">about 1 s</text>
  <text x="72" y="408" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" fill="#8e9aa7">PHYSICIAN APPEAL</text>
  <rect x="300" y="396" width="760" height="16" fill="#2b333d"/>
  <rect x="300" y="396" width="760" height="16" fill="#e8ecf1" opacity="0.85"/>
  <text x="1076" y="410" font-family="Georgia, serif" font-size="17" fill="#e8ecf1">hours</text>
</svg>
